---
- name: Verificar status de equipamentos Cisco IOS
  hosts: Cisco_Switch
  gather_facts: no
  connection: ansible.builtin.network_cli
  
  tasks:
    - name: Coletar resumo das interfaces
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
      register: int_brief

    - name: Coletar versão e informações do hardware
      cisco.ios.ios_command:
        commands:
          - show version
      register: ver_info

    - name: Exibir status das interfaces na tela
      ansible.builtin.debug:
        msg: "{{ int_brief.stdout_lines[0] }}"

    - name: Exibir versão do IOS na tela
      ansible.builtin.debug:
        msg: "{{ ver_info.stdout_lines[0] }}"
