---
- name: Configure Cisco IOU Lab Instances
  hosts: Prisma
  gather_facts: false

  tasks:
    - name: Gather facts from IOU Cisco device
      cisco.ios.ios_facts:
        gather_subset: min

    - name: Configure Hostname on IOU instance
      cisco.ios.ios_hostname:
        config:
          hostname: "{{ inventory_hostname }}"
        state: merged

    - name: Deploy Standard Interface Configurations
      cisco.ios.ios_interfaces:
        config:
          - name: Ethernet0/0
            description: "Configured via Ansible Network Automation"
            enabled: true
        state: merged
