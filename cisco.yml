---
- name: Configure Cisco IOU Lab Instances via Telnet
  hosts: Prisma
  gather_facts: false
  connection: local

  vars:
    console_port: 2001
    console_login_prompt: ">"

  tasks:
    - name: Gather info from IOU Cisco device
      ansible.netcommon.telnet:
        host: "{{ ansible_host }}"
        port: "{{ console_port }}"
        send_newline: true
        login_prompt: "{{ console_login_prompt }}"
        user: ""
        prompts:
          - "[>#]"
        command:
          - enable
          - terminal length 0
          - show version
      register: facts_saida

    - name: Show device info
      ansible.builtin.debug:
        var: facts_saida.output

    - name: Configure hostname and interface
      ansible.netcommon.telnet:
        host: "{{ ansible_host }}"
        port: "{{ console_port }}"
        send_newline: true
        login_prompt: "{{ console_login_prompt }}"
        user: ""
        prompts:
          - "[>#]"
        command:
          - enable
          - configure terminal
          - hostname {{ inventory_hostname }}
          - interface Ethernet0/0
          - description Configured via Ansible Network Automation
          - no shutdown
          - end
          - write memory
      register: config_saida

    - name: Show configuration output
      ansible.builtin.debug:
        var: config_saida.output
