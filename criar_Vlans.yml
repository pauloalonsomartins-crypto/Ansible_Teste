---
- name: Criar VLANs em equipamentos Cisco IOS
  hosts: Cisco_Switch
  gather_facts: no
  connection: ansible.builtin.network_cli

  vars:
    # Remova esta linha se ansible_network_os já estiver no inventário
    ansible_network_os: cisco.ios.ios

    # Lista padrão, usada quando NÃO vier vlan_id pelo survey.
    # Pode ser sobrescrita em "Variables" (extra vars) no template do AAP.
    vlans_lista:
      - { vlan_id: 10, nome: "ADMINISTRATIVO" }
      - { vlan_id: 20, nome: "FINANCEIRO" }

  tasks:
    # ---------- Montar a lista final ----------

    - name: Usar a VLAN informada no survey (se houver)
      ansible.builtin.set_fact:
        vlans_final:
          - vlan_id: "{{ vlan_id | int }}"
            nome: "{{ vlan_nome | default('VLAN' ~ vlan_id, true) }}"
      when: vlan_id is defined and vlan_id | string | length > 0

    - name: Usar a lista de VLANs (quando não há survey)
      ansible.builtin.set_fact:
        vlans_final: "{{ vlans_lista }}"
      when: vlans_final is not defined

    # ---------- Validações ----------

    - name: Validar IDs e nomes das VLANs
      ansible.builtin.assert:
        that:
          - item.vlan_id | int >= 2
          - item.vlan_id | int <= 4094
          - item.vlan_id | int not in [1002, 1003, 1004, 1005]
          - item.nome | length <= 32
          - "' ' not in item.nome"
        fail_msg: >-
          VLAN {{ item.vlan_id }} inválida: o ID deve estar entre 2 e 4094
          (exceto 1002-1005) e o nome deve ter até 32 caracteres, sem espaços.
        quiet: true
      loop: "{{ vlans_final }}"
      loop_control:
        label: "VLAN {{ item.vlan_id }}"

    # ---------- Criação ----------

    - name: Converter a lista para o formato do módulo ios_vlans
      ansible.builtin.set_fact:
        config_vlans: >-
          {{ config_vlans | default([]) + [{
               'vlan_id': item.vlan_id | int,
               'name': item.nome,
               'state': 'active',
               'shutdown': 'disabled'
             }] }}
      loop: "{{ vlans_final }}"
      loop_control:
        label: "VLAN {{ item.vlan_id }}"

    - name: Criar ou atualizar as VLANs
      cisco.ios.ios_vlans:
        config: "{{ config_vlans }}"
        state: merged
      register: resultado_vlans

    - name: Mostrar os comandos enviados ao switch
      ansible.builtin.debug:
        msg: "{{ resultado_vlans.commands | default(['Nenhuma alteração necessária']) }}"

    # ---------- Salvar e conferir ----------

    - name: Salvar a configuração (somente se houve mudança)
      cisco.ios.ios_config:
        save_when: modified
      when: not ansible_check_mode

    - name: Conferir as VLANs no switch
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_brief

    - name: Exibir show vlan brief
      ansible.builtin.debug:
        msg: "{{ vlan_brief.stdout_lines[0] }}"
